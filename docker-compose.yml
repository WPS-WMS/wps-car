services:
  postgres:
    image: postgres:16-alpine
    container_name: wps-car-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wps_car}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wps_car_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wps_car}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wps_car} -d ${POSTGRES_DB:-wps_car}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
